site_name: gracemaker

theme:
  name: "material"
#  logo: "imgs/logo1.png"  # Path to your logo image
  icon:
    logo: material/library
    admonition:
      tip: material/lightbulb-on-outline   # tip blocks get a light bulb
  features:
    - content.code.copy
#    - navigation.tabs # navigation on the top
    - navigation.sections   # Ensures that nested items are grouped in sections
    - navigation.expand     # Allows for expandable sections in the sidebar
    - navigation.tracking   # Highlights the active section in the sidebar
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: "teal"
      accent: "indigo"
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: "teal"
      accent: "indigo"
      toggle:
        icon: material/brightness-4
        name: Switch to system preference


plugins:
  - search
  - autorefs
  - glightbox

nav:
  - Start: index.md
  - Installation: gracemaker/install.md
  - Quick start: gracemaker/quickstart.md
  - Presets: gracemaker/presets.md
  - Input file: gracemaker/inputfile.md
  - CLI: gracemaker/cli.md
  - Utilities: gracemaker/utilities.md
  - Foundation models: gracemaker/foundation.md
  - Tutorials:
      - Fitting tutorials: gracemaker/tutorials.md
      - UQ workflows: gracemaker/uq_workflows.md
  - Uncertainty Quantification: gracemaker/uq.md
  - Fitting Generic Tensors: gracemaker/gen_tensor.md
  - FAQs: gracemaker/faq.md


markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: "#"
      separator: "-"
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.blocks.caption

extra_javascript:
  # Configures MathJax and loads it from a pinned, SRI-checked URL.
  # See docs/javascripts/mathjax.js to change the version.
  - javascripts/mathjax.js

#extra_css:
#  - stylesheets/extra.css
