name: PACE compatibility

on:
  pull_request:
    paths:
      - "tensorpotential/**"
      - "tests/test_pace_fitmetrics.py"
      - "pyproject.toml"
      - ".github/workflows/pace-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tensorflow-version: ["2.20.0", "2.21.0"]
    env:
      CUDA_VISIBLE_DEVICES: "-1"
      TF_USE_LEGACY_KERAS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest "tensorflow==${{ matrix.tensorflow-version }}" "tf-keras~=${{ matrix.tensorflow-version }}" .
      - name: Test PACE metrics and GRACE model operations
        run: |
          python -m pip check
          python -m pytest tests/test_pace_fitmetrics.py tests/test_linear_matmul_parity.py tests/test_tp_model.py tests/test_instructions.py tests/test_export.py
